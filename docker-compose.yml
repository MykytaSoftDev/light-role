services:
  postgres:
    image: postgres:16-alpine
    container_name: lightrole_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lightrole_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lightrole_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "--protected-mode", "yes"]
    networks:
      - lightrole_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lightrole_backend
    environment:
      # Derived / internal values only. These need cross-var interpolation and
      # must stay authoritative — `environment:` wins over the overlay `env_file:`.
      # All other backend vars (SECRET_KEY, ENVIRONMENT, COOKIE_SECURE,
      # FRONTEND_URL, OPENAI_API_KEY, PADDLE_*, GOOGLE_*, INTERNAL_RENDER_SECRET,
      # SENTRY_DSN, RESEND_*, etc.) come from the per-env env_file in the overlays.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      UPLOADS_DIR: /uploads
      # TAILOR-4: backend posts to the frontend's internal render endpoint
      # to server-render the React resume template.
      FRONTEND_INTERNAL_URL: ${FRONTEND_INTERNAL_URL:-http://frontend:3000}
    volumes:
      - uploads_data:/uploads
      - logs_data:/app/logs
    networks:
      - lightrole_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dev-api.lightrole.com}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
        NEXT_PUBLIC_PADDLE_ENVIRONMENT: ${NEXT_PUBLIC_PADDLE_ENVIRONMENT:-sandbox}
        NEXT_PUBLIC_PADDLE_PRICE_ID_PRO_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_ID_PRO_MONTHLY}
        NEXT_PUBLIC_PADDLE_PRICE_ID_PRO_ANNUAL: ${NEXT_PUBLIC_PADDLE_PRICE_ID_PRO_ANNUAL}
        NEXT_PUBLIC_PADDLE_PRICE_ID_UNLIMITED_MONTHLY: ${NEXT_PUBLIC_PADDLE_PRICE_ID_UNLIMITED_MONTHLY}
        NEXT_PUBLIC_PADDLE_PRICE_ID_UNLIMITED_ANNUAL: ${NEXT_PUBLIC_PADDLE_PRICE_ID_UNLIMITED_ANNUAL}
    container_name: lightrole_frontend
    environment:
      # Server-side-only URL for Server Components / Route Handlers calling the
      # backend from inside the frontend container. Derived/internal — stays in
      # base so it wins over the overlay env_file. NEXT_PUBLIC_* and other
      # runtime values come from the overlay env_file.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
    networks:
      - lightrole_net
    depends_on:
      - backend

volumes:
  postgres_data:
    name: lightrole_postgres_data
  uploads_data:
    name: lightrole_uploads_data
  logs_data:
    name: lightrole_logs_data

networks:
  lightrole_net:
    name: lightrole_network
    driver: bridge
