worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── Cloudflare real client IP restoration ─────────────────────
    # We sit behind the Cloudflare proxy (orange cloud), so every request
    # reaches nginx from a Cloudflare edge IP. Left unhandled, $binary_remote_addr
    # collapses to a handful of CF IPs and all visitors share one rate-limit /
    # conn-limit bucket — producing 429 storms on /_next/static chunks.
    # real_ip rewrites the client address to the visitor's true IP so that
    # rate limiting, connection limiting, and logs key on the actual client.
    # CF-Connecting-IP is only trusted when the request originates from one of
    # the official Cloudflare ranges below (source: https://www.cloudflare.com/ips/).
    # IPv4
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── DoS / slow-loris hardening ────────────────────────────────
    # Per-IP request-rate and connection limits. The zones are defined
    # here (http scope); the limits are *applied* per-location in the
    # prod template so we can tune burst per route. 10r/s sustained with
    # a generous burst easily covers normal SPA browsing & asset loads.
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Return 429 (not the default 503) when a request-rate limit trips.
    limit_req_status  429;
    limit_conn_status 429;

    # Slow-loris timeouts: drop clients that dribble headers/body slowly.
    # Body timeout is per read-op, not total, so 10s does not cap a large
    # (15M) upload over a healthy connection.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
