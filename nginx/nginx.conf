worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ── DoS / slow-loris hardening ────────────────────────────────
    # Per-IP request-rate and connection limits. The zones are defined
    # here (http scope); the limits are *applied* per-location in the
    # prod template so we can tune burst per route. 10r/s sustained with
    # a generous burst easily covers normal SPA browsing & asset loads.
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Return 429 (not the default 503) when a request-rate limit trips.
    limit_req_status  429;
    limit_conn_status 429;

    # Slow-loris timeouts: drop clients that dribble headers/body slowly.
    # Body timeout is per read-op, not total, so 10s does not cap a large
    # (15M) upload over a healthy connection.
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
